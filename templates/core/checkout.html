{% extends 'core/base.html' %}
{% block content %}
<h3>Оформление заявки</h3>
<form method="post" class="bg-white p-4 rounded shadow-sm">
    {% csrf_token %}
    <div class="row g-3">
        <div class="col-md-6"><label>ФИО</label><input name="name" class="form-control" value="{{ user.name }}" required></div>
        <div class="col-md-6"><label>Телефон</label><input name="phone" class="form-control" value="{{ user.phone }}" required></div>
        <div class="col-md-6"><label>Email</label><input name="email" type="email" class="form-control" value="{{ user.email }}" required></div>
        <div class="col-md-6"><label>Адрес доставки</label><input name="address" class="form-control" value="{{ user.address }}" required></div>
        <div class="col-12"><label>Примечания</label><textarea name="notes" class="form-control" rows="2"></textarea></div>
    </div>
    <hr>
    <p class="fs-5">К оплате: <strong>{{ total|floatformat:2 }} ₽</strong></p>
    <button type="submit" class="btn btn-primary">Подтвердить заявку</button>
    <a href="{% url 'cart' %}" class="btn btn-secondary">Назад</a>
</form>
{% endblock %}
