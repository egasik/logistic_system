{% extends 'core/base.html' %}
{% block content %}
<h3 class="mb-4">Каталог грузов и услуг</h3>
<form class="row g-2 mb-4" method="get">
    <div class="col-md-4">
        <select name="category" class="form-select">
            <option value="">Все категории</option>
            {% for c in categories %}<option value="{{ c.slug }}" {% if current_category == c.slug %}selected{% endif %}>{{ c.name }}</option>{% endfor %}
        </select>
    </div>
    <div class="col-md-5"><input type="text" name="q" class="form-control" placeholder="Поиск по названию..." value="{{ query }}"></div>
    <div class="col-md-3"><button type="submit" class="btn btn-primary w-100">Применить</button></div>
</form>
<div class="row g-4">
    {% for p in products %}
    <div class="col-md-3">
        <div class="card h-100">
            <div class="card-body">
                <h5 class="card-title">{{ p.name }}</h5>
                <p class="text-muted small">{{ p.category.name }} | Остаток: {{ p.stock }}</p>
                <p class="fw-bold">{{ p.price }} ₽</p>
                <a href="{% url 'product_detail' p.slug %}" class="btn btn-sm btn-outline-primary">Подробнее</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
