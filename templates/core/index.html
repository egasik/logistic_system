{% extends 'core/base.html' %}
{% block content %}
<div class="p-5 mb-4 bg-white rounded-3 text-center shadow-sm">
    <h1 class="display-5 fw-bold text-primary">Система управления логистикой</h1>
    <p class="lead">Учёт грузов, оформление заявок и контроль остатков в едином интерфейсе.</p>
    <a href="{% url 'catalog' %}" class="btn btn-primary btn-lg px-4">Перейти в каталог</a>
</div>
<div class="row g-4">
    {% for p in products %}
    <div class="col-md-3">
        <div class="card h-100">
            <div class="card-body">
                <h5 class="card-title">{{ p.name }}</h5>
                <p class="text-muted small">{{ p.category.name }}</p>
                <p class="fw-bold">{{ p.price }} ₽</p>
                <a href="{% url 'product_detail' p.slug %}" class="btn btn-sm btn-outline-primary">Подробнее</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
