{% extends 'admin/base_admin.html' %}

{% block admin_content %}
<h3>Редактирование пользователя</h3>
<form method="post" class="card mt-3">
    {% csrf_token %}
    <div class="card-body">
        <div class="row">
            <div class="col-md-6 mb-3"><label class="form-label">Имя</label><input class="form-control" name="first_name" value="{{ user_obj.first_name }}"></div>
            <div class="col-md-6 mb-3"><label class="form-label">Фамилия</label><input class="form-control" name="last_name" value="{{ user_obj.last_name }}"></div>
            <div class="col-md-6 mb-3"><label class="form-label">Телефон</label><input class="form-control" name="phone" value="{{ user_obj.phone|default:'' }}"></div>
            <div class="col-md-6 mb-3"><label class="form-label">Роль</label>
                <select class="form-select" name="role">
                    {% for value, label in role_choices %}
                    <option value="{{ value }}" {% if user_obj.role == value %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-12 mb-3"><label class="form-label">Адрес</label><textarea class="form-control" rows="2" name="address">{{ user_obj.address|default:'' }}</textarea></div>
            <div class="col-12 mb-3"><label class="form-label">Новый пароль</label><input type="password" class="form-control" name="password"></div>
            <div class="col-12">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="is_blocked" id="blocked" {% if user_obj.is_blocked %}checked{% endif %}>
                    <label class="form-check-label" for="blocked">Заблокировать пользователя</label>
                </div>
            </div>
        </div>
        <div class="mt-3">
            <button class="btn btn-primary" type="submit">Сохранить</button>
            <a href="{% url 'admin_users' %}" class="btn btn-outline-secondary">Отмена</a>
        </div>
    </div>
</form>
{% endblock %}
