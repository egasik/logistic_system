{% extends 'admin/base_admin.html' %}

{% block admin_content %}
<div class="card">
    <div class="card-body">
        <h4 class="mb-3">Удалить бренд "{{ brand.name }}"?</h4>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Удалить</button>
            <a href="{% url 'admin_brands' %}" class="btn btn-outline-secondary">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
