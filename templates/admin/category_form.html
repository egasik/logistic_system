{% extends 'admin/base_admin.html' %}

{% block admin_content %}
<h3>{% if action == 'add' %}➕ Добавить категорию{% else %}✏️ Редактировать категорию{% endif %}</h3>

<form method="post" class="mt-4">
    {% csrf_token %}
    
    <div class="card">
        <div class="card-body">
            <div class="mb-3">
                <label class="form-label">Название категории *</label>
                <input type="text" name="name" class="form-control" 
                       value="{{ category.name|default:'' }}" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Описание</label>
                <textarea name="description" class="form-control" rows="3">{{ category.description|default:'' }}</textarea>
            </div>
        </div>
        <div class="card-footer">
            <button type="submit" class="btn btn-primary">
                {% if action == 'add' %}💾 Сохранить{% else %}💾 Обновить{% endif %}
            </button>
            <a href="{% url 'admin_categories' %}" class="btn btn-outline-secondary">Отмена</a>
        </div>
    </div>
</form>
{% endblock %}
